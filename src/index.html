<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>Block Runner — open-city demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Pirata+One&display=swap" rel="stylesheet">
<style>
:root{--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:Impact,'Arial Black',system-ui,sans-serif;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
canvas#gl{display:block;width:100vw;height:100vh;height:100dvh}
#hud{position:fixed;inset:0;pointer-events:none;color:#fff;display:none;z-index:4}
#mini{position:absolute;right:calc(22px + var(--sr));top:calc(22px + var(--st));width:190px;height:190px;border-radius:50%;border:4px solid rgba(10,10,10,.8);box-shadow:0 3px 14px rgba(0,0,0,.55)}
#stats{position:absolute;right:calc(24px + var(--sr));top:calc(226px + var(--st));width:198px;text-align:right;text-shadow:2px 2px 0 #000}
#stars{font-size:28px;letter-spacing:3px;color:#ffd23f;font-family:system-ui,sans-serif}
#stars .off{color:rgba(255,255,255,.28)}
#hbar{height:12px;border:2px solid #000;background:#4a0d0d;margin-top:6px}
#hp{height:100%;width:100%;background:#d93030}
#weapon{font-size:20px;margin-top:8px;letter-spacing:1px}
#crewhud{font:800 13px system-ui,sans-serif;color:#5fd070;margin-top:3px;letter-spacing:1px;text-shadow:1px 1px 0 #000,-1px -1px 0 #000}
#warban{position:absolute;left:50%;top:calc(16px + var(--st));transform:translateX(-50%);font:900 19px system-ui,sans-serif;color:#fff;background:rgba(150,20,20,.82);padding:6px 18px;border-radius:4px;display:none;letter-spacing:1px;text-transform:uppercase;white-space:nowrap}
#bCrew{right:calc(206px + var(--sr));bottom:calc(88px + var(--sb));width:52px;height:52px;font-size:9px;background:rgba(46,140,70,.5)}
#speed{position:absolute;left:calc(26px + var(--sl));bottom:calc(22px + var(--sb));font-size:46px;text-shadow:3px 3px 0 #000;display:none}
#speed small{font-size:20px}
#prompt{position:absolute;left:50%;bottom:96px;transform:translateX(-50%);font:600 16px system-ui,sans-serif;background:rgba(0,0,0,.62);padding:9px 16px;border-radius:6px;display:none;white-space:nowrap}
#cross{position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;opacity:.85}
#big{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:110px;font-style:italic;color:#c8231e;text-shadow:5px 5px 0 #000;opacity:0;transition:opacity .5s;letter-spacing:4px;text-align:center}
#big small{display:block;font-size:36px;color:#fff;font-style:normal;margin-top:8px;letter-spacing:1px}
#money{font-size:30px;color:#4fb25a;letter-spacing:1px;margin-top:4px;text-shadow:2px 2px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000}
#abar{height:6px;border:2px solid #000;border-bottom:0;background:#0d1d4a;margin-top:6px;display:none}
#abar+#hbar{margin-top:0}
#ar{height:100%;background:#4a8cff;width:0}
#obj{position:absolute;left:50%;bottom:150px;transform:translateX(-50%);width:max-content;max-width:70vw;text-align:center;font:700 21px/1.35 system-ui,sans-serif;color:#fff;text-shadow:2px 2px 0 #000,0 0 6px #000}
#obj b{color:#ffd23f}
#timer{position:absolute;left:50%;top:calc(22px + var(--st));transform:translateX(-50%);font-size:44px;text-shadow:3px 3px 0 #000;display:none}
#note{position:absolute;left:calc(22px + var(--sl));top:calc(22px + var(--st));max-width:330px;font:500 15px/1.45 system-ui,sans-serif;background:rgba(0,0,0,.74);padding:12px 15px;border-radius:4px;display:none;pointer-events:auto}
#note b{color:#ffd23f}
#note [data-sp]{cursor:pointer}
#lockhint{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);font:600 13px system-ui,sans-serif;background:rgba(0,0,0,.55);padding:6px 12px;border-radius:5px;display:none}

/* ---------- loading screen + menus ---------- */
.screen{position:fixed;inset:0;z-index:10;display:none;overflow:hidden;background:#000;color:#fff}
.screen.show{display:block}
.arts{position:absolute;inset:0;overflow:hidden}
.art{position:absolute;inset:-2%;background-size:cover;background-position:center;opacity:0;animation:artcycle 20s linear infinite}
.art.a2{animation-delay:5s}.art.a3{animation-delay:10s}.art.a4{animation-delay:15s}
@keyframes artcycle{0%{opacity:0;transform:scale(1.02)}5%{opacity:1}25%{opacity:1}30%{opacity:0;transform:scale(1.1)}100%{opacity:0;transform:scale(1.1)}}
#boot .bar{position:absolute;left:calc(5% + var(--sl));bottom:calc(7% + var(--sb));width:min(46%,520px)}
#boot .lbl{font:400 clamp(20px,4.2vh,30px) 'Pirata One',serif;letter-spacing:1px;text-shadow:2px 2px 0 #000;margin-bottom:6px}
#loadbar{height:14px;border:3px solid #000;background:rgba(0,0,0,.65);box-shadow:0 0 0 1px rgba(255,255,255,.4)}
#loadfill{height:100%;width:0;background:linear-gradient(#ff9a3c,#c8231e)}
#loadmsg{margin-top:10px;font:700 clamp(13px,2.6vh,17px) system-ui,sans-serif;letter-spacing:2px;text-shadow:2px 2px 0 #000;min-height:1.3em}
.blink{animation:pulse 1.1s infinite}
@keyframes pulse{50%{opacity:.35}}
#boot .bootlogo{position:absolute;right:calc(5% + var(--sr));bottom:calc(6% + var(--sb));font:400 clamp(30px,8vh,64px)/.9 Anton,Impact,sans-serif;color:#ffd23f;text-shadow:3px 3px 0 #000,-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000;transform:skew(-8deg);text-align:right}
#menu .shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.65),rgba(0,0,0,.15) 45%,rgba(0,0,0,.7))}
#menu.paused{background:rgba(0,0,0,.55)}
#menu.paused .arts,#menu.paused .shade{display:none}
#logo{position:absolute;left:calc(5% + var(--sl));top:calc(8% + var(--st));font:400 clamp(44px,15vh,120px)/.86 Anton,Impact,sans-serif;color:#ffd23f;text-shadow:5px 5px 0 #000,-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000;transform:skew(-8deg);letter-spacing:2px}
#logo small{display:block;font:700 clamp(11px,2.3vh,16px) system-ui,sans-serif;color:#fff;letter-spacing:4px;margin-top:.6em;text-shadow:2px 2px 0 #000;transform:skew(8deg)}
#mpanel{position:absolute;right:calc(6% + var(--sr));top:50%;transform:translateY(-50%);width:min(44%,560px);max-height:92%;overflow-y:auto;scrollbar-width:none}
#mpanel::-webkit-scrollbar{display:none}
#mtitle{font:400 clamp(30px,8vh,58px) 'Pirata One',serif;color:#fff;text-shadow:3px 3px 0 #000;margin-bottom:.2em}
.mi{display:flex;justify-content:space-between;align-items:center;gap:12px;font:400 clamp(24px,6.2vh,46px)/1.25 'Pirata One',serif;color:#e9ddc2;text-shadow:3px 3px 0 #000;cursor:pointer;padding:0 .2em;transition:color .1s,transform .1s;touch-action:manipulation}
.mi.sel{color:#ffd23f;transform:translateX(-.3em)}
.mi.opt{font-size:clamp(18px,4.6vh,32px)}
.mv{display:flex;align-items:center;gap:.4em;font-family:system-ui,sans-serif;font-weight:700;font-size:.72em;white-space:nowrap}
.mv b{display:inline-flex;align-items:center;justify-content:center;width:1.6em;height:1.6em;border-radius:50%;background:rgba(0,0,0,.45);border:2px solid rgba(255,255,255,.4)}
.mv span{min-width:4.2em;text-align:center}
#minfo{font:500 clamp(12px,2.6vh,16px)/1.5 system-ui,sans-serif;text-shadow:1px 1px 0 #000;margin:.4em 0 .8em;background:rgba(0,0,0,.5);padding:.6em .9em;border-radius:6px}
#minfo:empty{display:none}
#minfo table{border-collapse:collapse}#minfo td{padding:.1em .9em .1em 0;vertical-align:top}#minfo td:first-child{color:#ffd23f;font-weight:800;white-space:nowrap}
#mhint{position:absolute;left:calc(5% + var(--sl));bottom:calc(5% + var(--sb));font:600 clamp(11px,2.2vh,14px) system-ui,sans-serif;opacity:.75;letter-spacing:1px;text-shadow:1px 1px 0 #000}
#bye .msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.55);font:400 clamp(36px,10vh,80px) 'Pirata One',serif;text-shadow:3px 3px 0 #000;text-align:center}
#bye .msg small{font:600 clamp(13px,2.6vh,17px) system-ui,sans-serif;letter-spacing:2px;margin-top:1em}
#shop{background:transparent;touch-action:none}
#mini{pointer-events:auto;cursor:pointer}
#bmap{background:#27384a;touch-action:none;user-select:none}
#bmc{position:absolute;inset:0;width:100%;height:100%;display:block}
#bmtop{position:absolute;left:0;right:0;top:0;display:flex;gap:8px;align-items:center;padding:calc(8px + var(--st)) calc(12px + var(--sr)) 8px calc(12px + var(--sl));background:linear-gradient(#000a,#0000);pointer-events:none}
#bmtop b{font:900 20px system-ui,sans-serif;letter-spacing:2px;margin-right:auto;text-shadow:1px 1px 0 #000}
.bmb{pointer-events:auto;font:800 13px system-ui,sans-serif;background:rgba(0,0,0,.55);border:2px solid rgba(255,255,255,.6);border-radius:8px;padding:9px 13px;cursor:pointer;color:#fff}
.bmb:active{background:rgba(255,255,255,.25)}
#bmleg{position:absolute;left:calc(12px + var(--sl));bottom:calc(10px + var(--sb));background:rgba(0,0,0,.6);border-radius:8px;padding:7px 10px;font:600 11px system-ui,sans-serif;line-height:1.7;pointer-events:none}
#bmleg i{display:inline-block;width:14px;height:14px;border-radius:50%;border:1.5px solid #000;color:#000;font:900 9px/12px system-ui;text-align:center;font-style:normal;margin-right:5px;vertical-align:-2px}
#bmhint{position:absolute;right:calc(12px + var(--sr));bottom:calc(10px + var(--sb));font:600 11px system-ui,sans-serif;background:rgba(0,0,0,.6);border-radius:8px;padding:7px 10px;pointer-events:none;text-align:right}
#shop .panel{position:absolute;right:calc(3% + var(--sr));top:50%;transform:translateY(-50%);width:min(46%,480px);max-height:94%;overflow-y:auto;background:rgba(10,10,16,.8);border-radius:10px;padding:14px 18px;box-shadow:0 6px 30px rgba(0,0,0,.5);scrollbar-width:none}
#shop .stitle{font:400 clamp(24px,6vh,40px) 'Pirata One',serif;color:#ffd23f;text-shadow:2px 2px 0 #000}
#shop .scash{font:700 clamp(13px,2.8vh,17px) system-ui,sans-serif;color:#4fb25a;margin-bottom:6px}
#shop .srow{display:flex;justify-content:space-between;align-items:center;gap:10px;font:600 clamp(13px,3.3vh,18px) system-ui,sans-serif;color:#e9ddc2;padding:.32em .3em;border-radius:6px;cursor:pointer}
#shop .srow.dim{opacity:.45}
#shop .rd{font-weight:500;font-size:.78em;color:#aab;text-align:right}
#shop .rd b{margin-left:.5em;color:#ff8a7a;padding:0 .35em;border-radius:5px;border:1px solid rgba(255,138,122,.4)}
#shop .srow.sel{background:rgba(255,210,63,.14);color:#ffd23f}
#shop .srow em{font-style:normal;color:#4fb25a;font-size:.85em}
#shop .srow.act{justify-content:center;font-family:'Pirata One',serif;font-weight:400;font-size:clamp(19px,4.6vh,28px);margin-top:4px;border:1px solid rgba(255,255,255,.15)}
#shop .mv span{min-width:7.2em;display:inline-flex;align-items:center;justify-content:center;gap:.4em}
#shop .sw{display:inline-block;width:1em;height:1em;border-radius:3px;border:2px solid #fff}
#shop.guns .gname{font:800 clamp(18px,4.4vh,26px) system-ui,sans-serif;color:#fff;margin-top:2px}
#shop.guns .gcat{font:600 clamp(11px,2.4vh,14px) system-ui,sans-serif;color:#e0b83c;margin-bottom:6px;text-transform:uppercase;letter-spacing:1px}
#shop.guns .gdesc{font:500 clamp(12px,2.6vh,15px) system-ui,sans-serif;color:#e9ddc2;margin:4px 0 8px}
#shop.guns .gst{display:flex;align-items:center;gap:10px;font:600 clamp(11px,2.5vh,14px) system-ui,sans-serif;color:#e9ddc2;margin:3px 0}
#shop.guns .gst span{width:6.5em}#shop.guns .gst i{flex:1;height:8px;background:rgba(255,255,255,.12);border-radius:4px;overflow:hidden}#shop.guns .gst b{display:block;height:100%;background:#ffd23f}
#shop.guns .gclip{font:600 clamp(11px,2.4vh,13px) system-ui,sans-serif;color:#aab;margin:4px 0}
#shop.guns .gown{font:700 clamp(12px,2.6vh,14px) system-ui,sans-serif;color:#4fb25a;margin:6px 0}#shop.guns .gown.warn{color:#ff9a5a}
#shop.guns .srow.dim{opacity:.45}
#shop.guns .gnav{display:flex;justify-content:center;gap:10px;margin:8px 0 2px}#shop.guns .gnav b{width:2.2em;height:2.2em;display:flex;align-items:center;justify-content:center;border-radius:8px;border:1px solid rgba(255,255,255,.25);color:#ffd23f;font-size:clamp(14px,3vh,18px);cursor:pointer;background:rgba(255,255,255,.05)}
#shop .shint{position:absolute;left:calc(4% + var(--sl));bottom:calc(5% + var(--sb));font:600 clamp(11px,2.2vh,14px) system-ui,sans-serif;color:#fff;text-shadow:1px 1px 0 #000;opacity:.85}
#rotate{position:fixed;inset:0;z-index:50;background:#000;color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;font:700 20px system-ui,sans-serif;text-align:center;padding:30px}
#rotate .ph{width:54px;height:92px;border:4px solid #ffd23f;border-radius:10px;animation:rot 2s ease-in-out infinite}
@keyframes rot{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait) and (pointer:coarse){#rotate{display:flex}}

/* ---------- touch controls ---------- */
#touch{position:fixed;inset:0;z-index:3;display:none}
body.touchui.ingame #touch{display:block}
#stickZone{position:absolute;left:0;top:0;width:45%;height:100%;touch-action:none}
#lookZone{position:absolute;right:0;top:0;width:55%;height:100%;touch-action:none}
#stickBase{position:absolute;width:128px;height:128px;margin:-64px 0 0 -64px;border-radius:50%;border:3px solid rgba(255,255,255,.35);background:rgba(0,0,0,.2);display:none;pointer-events:none}
#stickKnob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:rgba(255,255,255,.5)}
#stickHint{position:absolute;left:calc(70px + var(--sl));bottom:calc(60px + var(--sb));width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;border:3px dashed rgba(255,255,255,.22);pointer-events:none}
.tbtn{position:absolute;border-radius:50%;background:rgba(0,0,0,.38);border:3px solid rgba(255,255,255,.55);color:#fff;font:800 12px system-ui,sans-serif;letter-spacing:.5px;display:flex;align-items:center;justify-content:center;text-align:center;touch-action:none;user-select:none;text-shadow:1px 1px 0 #000}
.tbtn.on{background:rgba(255,210,63,.6);border-color:#ffd23f}
.tbtn.hide{display:none}
#bFire{right:calc(26px + var(--sr));bottom:calc(26px + var(--sb));width:92px;height:92px;font-size:15px;background:rgba(200,35,30,.45)}
#bFireL{left:calc(30px + var(--sl));bottom:calc(172px + var(--sb));width:80px;height:80px;font-size:14px;background:rgba(200,35,30,.45)}
#bJump{right:calc(134px + var(--sr));bottom:calc(20px + var(--sb));width:62px;height:62px}
#bAim{right:calc(124px + var(--sr));bottom:calc(100px + var(--sb));width:56px;height:56px}
#bEnter{right:calc(36px + var(--sr));bottom:calc(128px + var(--sb));width:58px;height:58px;background:rgba(40,110,200,.45)}
#bHorn{right:calc(206px + var(--sr));bottom:calc(24px + var(--sb));width:52px;height:52px}
#bWeap{right:calc(206px + var(--sr));bottom:calc(24px + var(--sb));width:52px;height:52px;font-size:10px}
#bPause{left:calc(12px + var(--sl));top:calc(12px + var(--st));width:46px;height:46px;border-radius:10px;font-size:16px}
body.touchui #note{left:calc(70px + var(--sl))}
body.touchui #speed{left:50%;transform:translateX(-50%);bottom:calc(8px + var(--sb));font-size:34px}
body.touchui #obj{bottom:calc(78px + var(--sb));font-size:16px;max-width:52vw}
body.touchui #prompt{bottom:calc(150px + var(--sb))}
body.touchui #weapon{display:none}
body.touchui #cross{width:22px;height:22px;margin:-11px 0 0 -11px}
@media (max-height:520px){
  #mini{width:118px;height:118px;top:calc(10px + var(--st));right:calc(12px + var(--sr));border-width:3px}
  #stats{top:calc(132px + var(--st));right:calc(12px + var(--sr));width:124px}
  #stars{font-size:17px;letter-spacing:1px}#weapon{font-size:13px;margin-top:4px}#money{font-size:18px}#hbar{height:8px}
  #timer{font-size:30px;top:calc(8px + var(--st))}
  #note{font-size:12px;max-width:250px;padding:8px 10px;top:calc(10px + var(--st))}
  #big{font-size:52px}#big small{font-size:20px}
  #prompt{font-size:13px}
  /* phones: stats sit beside the minimap so they never collide with the ENTER/AIM/FIRE cluster */
  body.touchui #stats{top:calc(10px + var(--st));right:calc(146px + var(--sr));width:132px}
  body.touchui #crewhud{white-space:nowrap;font-size:11px}
  body.touchui #warban{top:calc(92px + var(--st));left:auto;right:calc(146px + var(--sr));transform:none;font-size:13px;padding:4px 10px}
}
</style>
<style>/*ART_CSS*/</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="hud">
  <canvas id="mini" width="190" height="190"></canvas>
  <div id="stats">
    <div id="stars"></div>
    <div id="abar"><div id="ar"></div></div>
    <div id="hbar"><div id="hp"></div></div>
    <div id="weapon"></div>
    <div id="money"></div>
    <div id="crewhud"></div>
  </div>
  <div id="warban"></div>
  <div id="obj"></div>
  <div id="timer"></div>
  <div id="note"></div>
  <div id="speed"></div>
  <div id="prompt"></div>
  <svg id="cross" viewBox="0 0 26 26"><circle cx="13" cy="13" r="2" fill="#fff" stroke="#000" stroke-width="1"/><path d="M13 2v6M13 18v6M2 13h6M18 13h6" stroke="#fff" stroke-width="2"/><path d="M13 2v6M13 18v6M2 13h6M18 13h6" stroke="#000" stroke-width=".6"/></svg>
  <div id="big"></div>
  <div id="lockhint">Click the game to capture the mouse</div>
</div>
<div id="touch">
  <div id="stickZone"></div><div id="lookZone"></div>
  <div id="stickHint"></div>
  <div id="stickBase"><div id="stickKnob"></div></div>
  <div class="tbtn" id="bFire">FIRE</div>
  <div class="tbtn hide" id="bFireL">FIRE</div>
  <div class="tbtn" id="bJump">JUMP</div>
  <div class="tbtn" id="bAim">AIM</div>
  <div class="tbtn hide" id="bEnter">ENTER</div>
  <div class="tbtn hide" id="bHorn">HORN</div>
  <div class="tbtn" id="bWeap">9MM</div>
  <div class="tbtn hide" id="bCrew">CREW</div>
  <div class="tbtn" id="bPause">❚❚</div>
</div>
<div id="boot" class="screen show">
  <div class="arts"><div class="art a1"></div><div class="art a2"></div><div class="art a3"></div><div class="art a4"></div></div>
  <div class="bootlogo">BLOCK<br>RUNNER</div>
  <div class="bar"><div class="lbl">Loading</div><div id="loadbar"><div id="loadfill"></div></div><div id="loadmsg"></div></div>
</div>
<div id="menu" class="screen">
  <div class="arts"><div class="art a1"></div><div class="art a2"></div><div class="art a3"></div><div class="art a4"></div></div>
  <div class="shade"></div>
  <div id="logo">BLOCK<br>RUNNER<small>OPEN-CITY DEMO</small></div>
  <div id="mpanel"><div id="mtitle"></div><div id="minfo"></div><div id="mitems"></div></div>
  <div id="mhint"></div>
</div>
<div id="bmap" class="screen"><canvas id="bmc"></canvas><div id="bmtop"><b>MAP</b><div class="bmb" id="bmWp">SET WAYPOINT</div><div class="bmb" id="bmClr">CLEAR</div><div class="bmb" id="bmHome">ME</div><div class="bmb" id="bmX">✕</div></div><div id="bmleg"></div><div id="bmhint"></div></div>
<div id="shop" class="screen"><div class="panel"></div><div class="shint"></div></div>
<div id="bye" class="screen">
  <div class="arts"><div class="art a1"></div><div class="art a2"></div><div class="art a3"></div><div class="art a4"></div></div>
  <div class="msg">Thanks for playing<small class="blink">TAP OR PRESS ANY KEY TO RETURN</small></div>
</div>

  let p=null;for(const q of parts)if(!q.alive){p=q;break;}
  if(!p){if(parts.length>300)return;const m=new THREE.Mesh(sphG,new THREE.MeshBasicMaterial({color,transparent:true,depthWrite:false}));scene.add(m);p={m,v:new V3()};parts.push(p);}
  p.alive=true;p.m.visible=true;p.m.material.color.setHex(color);p.m.position.set(x,y,z);p.v.set(vx,vy,vz);p.life=p.max=life;p.size=size;p.grow=grow;p.grav=grav;p.op=op||.9;p.m.scale.setScalar(size);}
function updateParts(dt){for(const p of parts){if(!p.alive)continue;p.life-=dt;if(p.life<=0){p.alive=false;p.m.visible=false;continue;}
  p.v.y-=p.grav*dt;p.m.position.addScaledVector(p.v,dt);if(p.m.position.y<.05){p.m.position.y=.05;p.v.y=0;p.v.x*=.8;p.v.z*=.8;}
  p.m.scale.setScalar(p.size+p.grow*(p.max-p.life));p.m.material.opacity=p.op*(p.life/p.max);}}

let pendingFail=false;

function die(msg){if(player.inSeq)abortSeq(player.inSeq);player.dead=true;player.deadT=0;player.deathMsg=msg;

function respawn(){
  for(const q of crewList())releaseFollower(q);crewHold=false;
  G_ANGER.fill(0);for(const q of peds)if(q.gang!==undefined)q.target=null;
  player.dead=false;player.hp=100;heat=0;player.stun=0;player.knock.set(0,0,0);player.vy=0;
  if(player.inSeq)abortSeq(player.inSeq);if(player.car){const pc=player.car;unseat(player,pc);pc.ai='parked';}
  for(const c of cars.slice())if(c.ai==='police')removeCar(c);
  const ho=HOMEDATA.saved&&homeOutside();if(ho){player.pos.set(ho.x,0,ho.z);player.facing=ho.face;camYaw=ho.face;}else{const b=pick(blocks.filter(b=>!b.park)),cs=corners(b);player.pos.set(cs[0][0],0,cs[0][1]);}

  player.armour=0;const lost=Math.min(100,money);addMoney(-100);

function killPed(p,fling,byPlayer){if(p.state==='dead')return;if(p.act)endAct(p);p.cross=null;p.crossing=false;p.pairOf=null;
  if(p.gang!==undefined)gangOnKill(p,byPlayer);
  if(p.state==='seated'&&p.car){if(fling)unseat(p,p.car);else{const c=p.car;p.state='dead';p.hp=0;p.deadT=0;if(c.occ.d===p&&c!==player.car)c.ai='parked';
    for(let k=0;k<4;k++)puff(p.pos.x,p.pos.y+.3,p.pos.z,rf(-1,1),rf(0,1.5),rf(-1,1),.4,0x8a1010,.1,.1,6,.9);
    scare(p.pos.x,p.pos.z,30);if(byPlayer)addHeat(p.cop?2:1,p.cop?2:1);return;}}p.state='dead';p.hp=0;p.deadT=0;p.fall=0;
  if(fling){p.air=true;p.flyV.set(fling.x,fling.y,fling.z);p.spin=0;}
  for(let k=0;k<5;k++)puff(p.pos.x,1.2,p.pos.z,rf(-1.5,1.5),rf(0,2),rf(-1.5,1.5),.4,0x8a1010,.12,.1,6,.9);
  scare(p.pos.x,p.pos.z,30);if(byPlayer&&p.gang===undefined)addHeat(p.cop?2:1,p.cop?2:1);
  if(pickups.filter(q=>q.temp).length<20)makePickup('cash',p.pos.x,p.pos.z,{amount:p.cop?Math.round(rf(40,80)):p.gang!==undefined?Math.round(rf(30,90)):Math.round(rf(5,40)),temp:true});}
function damageCar(c,amt,byPlayer){if(c.burnt)return;c.hp-=amt;if(byPlayer&&c.police)addHeat(1,2);if(c.hp<=0)blowUp(c,byPlayer);}
function blowUp(c,byPlayer){if(c.burnt)return;c.burnt=true;c.hp=0;c.burnT=0;c.m.paint.color.setHex(0x1c1a19);if(c.m.paint2!==c.m.paint)c.m.paint2.color.setHex(0x111111);
  if(c.m.bar)c.m.bar.forEach(m=>m.color.setHex(0x111111));
  if(c.m.mats)c.m.mats.forEach(m=>{if(m.isMeshLambertMaterial)m.color.multiplyScalar(.15);else m.color.setHex(0x111111);});
  c.hopV=7;if(c.occ)for(const k in c.occ){const q=c.occ[k];if(q&&!isPlayer(q)){if(q.state==='dead'){unseat(q,c);q.air=true;q.flyV.set(rf(-4,4),6,rf(-4,4));}else{unseat(q,c);killPed(q,{x:rf(-5,5),y:7,z:rf(-5,5)},byPlayer);}}}
  if(player.car===c)hurtPlayer(999);
  explodeAt(c.pos.x,1,c.pos.z,byPlayer,c);}
function explodeAt(x,y,z,byPlayer,src){
  for(let k=0;k<28;k++)puff(x,y,z,rf(-13,13),rf(2,11),rf(-13,13),rf(.45,.95),k%2?0xffa62a:0xff4e10,.9,3.2,5,.95);
  for(let k=0;k<14;k++)puff(x,y+.5,z,rf(-3,3),rf(2,6),rf(-3,3),rf(2,3.5),0x2a2724,1.1,2.6,-.3,.8);

  for(const p of peds.slice()){if(p.state==='dead')continue;const q=d2(p.pos.x,p.pos.z,x,z);if(q<64){const d=Math.sqrt(q)||1;killPed(p,{x:(p.pos.x-x)/d*11,y:8,z:(p.pos.z-z)/d*11},byPlayer);}}
  if(!player.car&&!player.dead){const q=d2(player.pos.x,player.pos.z,x,z);if(q<64){const d=Math.sqrt(q)||1;player.knock.set((player.pos.x-x)/d*12,0,(player.pos.z-z)/d*12);player.vy=6;player.stun=2.4;hurtPlayer((8-d)*15);}}
  for(const o of cars.slice()){if(o===src)continue;const q=d2(o.pos.x,o.pos.z,x,z);if(q<81){const d=Math.sqrt(q)||1;o.vel.x+=(o.pos.x-x)/d*(9-d)*1.6;o.vel.z+=(o.pos.z-z)/d*(9-d)*1.6;damageCar(o,(9-d)*10,byPlayer);}}
}

function seatForDoor(c,door,freeOnly){for(const k of seatKeys(c)){if(layOf(c).seats[k].door===door&&(!freeOnly||!c.occ[k]))return k;}return null;}

function doorOut(c,side){const D=layOf(c).doors[side],o=D.out||[Math.sign(D.x),0],ax=Math.cos(c.h),az=-Math.sin(c.h),fx=Math.sin(c.h),fz=Math.cos(c.h);return{x:ax*o[0]+fx*o[1],z:az*o[0]+fz*o[1]};}

function camBlocked(x,y,z){if(INSIDE)return insideBlocked(x,y,z);for(const b of colNear(x-.3,x+.3,z-.3,z+.3)){if(b.small)continue;if(y<b.h+.3&&colInside(b,x,z,.3))return true;}return false;}
let camDistS=5,camLift=0;
function updateCamera(dt){
  let target,dist;

    if(now-lastMouse>1.3){const want=c.F<-2?c.h+Math.PI:c.h;camYaw=lerpAng(camYaw,want,dt*3.2);camPitch+=(.2-camPitch)*Math.min(1,dt*2);}
    const carAim=mouse.right||T.aim||player.aimT>0;
    camLift+=((carAim?1:0)-camLift)*Math.min(1,dt*7);
    if(carAim)camPitch=Math.min(camPitch,.32);
    const rx=-Math.cos(camYaw),rz=Math.sin(camYaw);
    target=new V3(c.pos.x+rx*camLift*1.1,1.7+camLift*2.2+c.hopY,c.pos.z+rz*camLift*1.1);dist=8.6+Math.abs(c.F)*.05-camLift*1.6;
    camera.fov+=(65+Math.min(18,Math.abs(c.F)*.35)-camera.fov)*Math.min(1,dt*3);
  }else{const aim=mouse.right||T.aim;const zg=aim&&curGun().zoom;const rx=-Math.cos(camYaw),rz=Math.sin(camYaw);const so=zg?.55:aim?.8:.4;
    const by=player.dead?.4:player.pos.y+1.5;

    camera.fov+=((zg?curGun().zoom:aim?50:65)-camera.fov)*Math.min(1,dt*8);}
  camera.updateProjectionMatrix();
  camDistS+=(dist-camDistS)*Math.min(1,dt*(dist<camDistS?12:4));

  let dd=camDistS;
  for(let s=.6;s<=camDistS;s+=.3){const x=target.x-dir.x*s,y=target.y-dir.y*s,z=target.z-dir.z*s;if(camBlocked(x,y,z)){dd=Math.max(.6,s-.35);break;}}
  camera.position.set(target.x-dir.x*dd,Math.max(.35,target.y-dir.y*dd),target.z-dir.z*dd);
  camera.lookAt(camera.position.x+dir.x,camera.position.y+dir.y,camera.position.z+dir.z);
  if(shake>0){camera.position.x+=rf(-1,1)*shake*.25;camera.position.y+=rf(-1,1)*shake*.25;camera.position.z+=rf(-1,1)*shake*.25;shake=Math.max(0,shake-dt*2.2);}
}

let musicTimer=null,mNext=0,mStep=0;
const BPM=92,STEP=60/BPM/4,mtof=n=>440*Math.pow(2,(n-69)/12);
const BASS=[43,0,0,43,0,0,46,0,48,0,0,46,0,43,41,0];
const CHORDS=[[55,58,62,65],[53,57,60,64],[51,55,58,62],[53,57,60,63]];
const LEAD=[[0,79],[3,77],[6,74],[10,72],[12,74]];
function mEnv(g,t,a,v,d){g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(.0008,t+a+d);}
function mOsc(type,f,t,a,v,d,dest,filt){const o=AC.createOscillator();o.type=type;o.frequency.setValueAtTime(f,t);const g=AC.createGain();mEnv(g,t,a,v,d);
  if(filt){const fl=AC.createBiquadFilter();fl.type='lowpass';fl.frequency.value=filt;o.connect(fl).connect(g);}else o.connect(g);g.connect(dest);o.start(t);o.stop(t+a+d+.05);return o;}
function mNoise(t,v,d,type,freq){const s=AC.createBufferSource();s.buffer=noiseBuf;const f=AC.createBiquadFilter();f.type=type;f.frequency.value=freq;const g=AC.createGain();mEnv(g,t,.002,v,d);s.connect(f).connect(g).connect(musicGain);s.start(t,Math.random());s.stop(t+d+.05);}
function playStep(s,t){
  const b=s%16,bar=Math.floor(s/16)%4;
  if(b===0||b===7||b===10){const o=mOsc('sine',130,t,.002,.9,.32,musicGain);o.frequency.exponentialRampToValueAtTime(42,t+.18);}
  if(b===4||b===12){mNoise(t,.42,.16,'bandpass',1900);mOsc('triangle',190,t,.002,.25,.08,musicGain);}
  if(b%2===0)mNoise(t,b%4===2?.12:.06,.035,'highpass',7500);
  const n=BASS[b];if(n)mOsc('sawtooth',mtof(n+(bar===2?-3:bar===1?-2:0)),t,.005,.32,STEP*1.7,musicGain,380);
  if(b===0)for(const c of CHORDS[bar])mOsc('triangle',mtof(c),t,.25,.035,STEP*15,musicGain,1800);
  if(bar%2===1)for(const [st,nn] of LEAD)if(st===b){const o=mOsc('sine',mtof(nn+(bar===3?-2:0)),t,.03,.09,STEP*2.6,musicGain);o.frequency.setValueAtTime(mtof(nn-1),t);o.frequency.linearRampToValueAtTime(mtof(nn+(bar===3?-2:0)),t+.08);}
}
function schedMusic(){if(!AC)return;while(mNext<AC.currentTime+.3){playStep(mStep,mNext);mNext+=STEP;mStep=(mStep+1)%64;}}
function startMusic(){if(!AC||musicTimer||!noiseBuf)return;mNext=AC.currentTime+.12;mStep=0;musicTimer=setInterval(schedMusic,70);}
function stopMusic(){if(musicTimer){clearInterval(musicTimer);musicTimer=null;}}
function blip(f){if(!AC||!outGain)return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type='square';o.frequency.value=f;mEnv(g,t,.002,.07,.07);
  const fl=AC.createBiquadFilter();fl.type='lowpass';fl.frequency.value=2400;o.connect(fl).connect(g).connect(outGain);o.start(t);o.stop(t+.12);}

  else if(e.code==='ArrowLeft'||e.code==='KeyA'){if(shop.sel<shop.rows.length)shopChange(shop.sel,-1);}
  else if(e.code==='ArrowRight'||e.code==='KeyD'){if(shop.sel<shop.rows.length)shopChange(shop.sel,1);}

  for(const p of peds)if(p.bumpT){p.bumpT-=dt;if(p.bumpT<=0)p.bumpT=0;}}
// someone always phones it in
function witnessCall(x,z){const c=peds.filter(p=>p.state==='flee'&&!p.cop&&p.gang===undefined&&!p.inSeq&&d2(p.pos.x,p.pos.z,x,z)>12*12&&d2(p.pos.x,p.pos.z,x,z)<40*40);if(!c.length)return;
  const p=pick(c);setTimeout(()=>{if(!peds.includes(p)||p.state!=='flee')return;p.state='walk';p.cross=null;p.act='phone';p.actT=4.5;phoneOn(p,true);p.block=p.block||blocks[0];
    p.facing=Math.atan2(x-p.pos.x,z-p.pos.z);say(p,pick(['Police? Someone\'s shooting!','911! Hurry!','There\'s a maniac out here!','Get the cops down here!']),3);
    setTimeout(()=>{if(peds.includes(p)&&p.act==='phone'){endAct(p);p.state='flee';p.fleeT=6;p.threat={x,z};}},4500);},rf(1200,2600));}
// ---- crowd density around the player ----
const ALLWALK=[];blocks.forEach(b=>b.walk.forEach((p,i)=>ALLWALK.push({b,i,x:p[0],z:p[1]})));
function lifeSpawnPos(far){const f=focus();const cf=new V3();camera.getWorldDirection(cf);
  const near=ALLWALK.filter(w=>{const q=d2(w.x,w.z,f.x,f.z);return q<105*105&&q>(far?40*40:8*8);});if(!near.length)return null;
  for(let k=0;k<40;k++){const w=pick(near),W=w.b.walk,j=(w.i+1)%W.length,t=Math.random(),x=w.x+(W[j][0]-w.x)*t,z=w.z+(W[j][1]-w.z)*t;
    const q=d2(x,z,f.x,f.z);if(far&&q<85*85){const dx=x-f.x,dz=z-f.z,l=Math.sqrt(q);if((dx*cf.x+dz*cf.z)/l>.25&&k<30)continue;}
    return{x,z,blk:w.b,tg:Math.random()<.5?j:w.i};}
  return null;}
function decorateSpawn(p){if(p.cop||p.gang!==undefined)return;p.nextAct=rf(3,18);
  const r=Math.random();
  if(r<.08){p.jog=true;p.speed=rf(3.6,4.2);applyLook(p.h,Object.assign(p.h.look,{top:pick(['vest','tracksuit','tee']),bottom:pick(['short','joggers']),shoes:'trainers',hat:'none',eyewear:'none',extra:pick(['none','headphones'])}));}
  else if(r<.17){p.dog=makeDog();p.dog.pos.set(p.pos.x,0,p.pos.z);p.speed=rf(1.1,1.4);}
  else if(r<.33){const q=spawnPed({x:p.pos.x+.8,z:p.pos.z,blk:p.block,tg:p.target,noDeco:true});q.pairOf=p;q.speed=p.speed;q.dir=p.dir;q.nextAct=1e9;}}
let lifeAudio=null;
function updateLifeAudio(dt){if(!AC)return;
  if(!lifeAudio){const mk=(type,f,q)=>{const s=AC.createBufferSource();s.buffer=noiseBuf;s.loop=true;const fl=AC.createBiquadFilter();fl.type=type;fl.frequency.value=f;if(q)fl.Q.value=q;const g=AC.createGain();g.gain.value=0;s.connect(fl);fl.connect(g);g.connect(master);s.start();return g;};
    lifeAudio={rumble:mk('lowpass',260),murmur:mk('bandpass',900,1.4),birdT:2};}
  const t=AC.currentTime,f=focus();let n=0;for(const p of peds)if(p.state!=='dead'&&p.gang===undefined&&d2(p.pos.x,p.pos.z,f.x,f.z)<18*18)n++;
  const inside=!!INSIDE;lifeAudio.rumble.gain.setTargetAtTime(inside?.004:.03,t,.5);lifeAudio.murmur.gain.setTargetAtTime(inside?0:Math.min(.035,n*.004),t,.6);
  lifeAudio.birdT-=dt;if(lifeAudio.birdT<=0&&!inside){lifeAudio.birdT=rf(1.5,5);if(stars()===0&&Math.random()<.7){const n2=1+Math.floor(Math.random()*3),b=rf(2600,3800);
    for(let k=0;k<n2;k++){const o=AC.createOscillator(),g=AC.createGain(),s=t+k*.13;o.type='sine';o.frequency.setValueAtTime(b,s);o.frequency.exponentialRampToValueAtTime(b*rf(1.2,1.6),s+.07);
      g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(.018,s+.01);g.gain.exponentialRampToValueAtTime(.0005,s+.09);o.connect(g);g.connect(master);o.start(s);o.stop(s+.1);}}}}
function honk(c){if(!AC||c.honkT>now)return;c.honkT=now+rf(2.5,5);const v=volAt(c.pos.x,c.pos.z,.22);if(v<.01)return;const t=AC.currentTime;
  for(const fr of[392,494]){const o=AC.createOscillator(),g=AC.createGain();o.type='square';o.frequency.value=fr;g.gain.setValueAtTime(v*.35,t);g.gain.setValueAtTime(v*.35,t+.28);g.gain.linearRampToValueAtTime(0,t+.34);o.connect(g);g.connect(master);o.start(t);o.stop(t+.36);}}
function updateLife(dt){updateBubbles(dt);lifeReact(dt);for(const p of peds)if(p.dog)updateDog(p,dt);updateLifeAudio(dt);
  const f=focus();for(const p of peds.slice()){if(p.cop||p.gang!==undefined||p.inSeq||p.state==='seated'||p.state==='dead'&&p.deadT<20)continue;if(d2(p.pos.x,p.pos.z,f.x,f.z)>135*135&&(!p.pairOf||!peds.includes(p.pairOf)))removePed(p);}}

// ======================================================================
// MAIN LOOP
// ======================================================================
let lastT=performance.now();
function frame(t){requestAnimationFrame(frame);let dt=(t-lastT)/1000;lastT=t;if(dt>.05)dt=.05;if(dt<0)dt=0;
  if(state==='boot'||state==='starting'){bootTick();return;}
  if(state==='shop'){shopFrame(dt);return;}
  if(state==='list'){listFrame(dt);return;}
  if(state==='map'){mapFrame(dt);return;}
  if(state==='gunshop'){gunFrame(dt);return;}
  if(state!=='game')return;
  if(touchUI&&innerHeight>innerWidth)return;
  update(dt);renderer.render(scene,camera);}
let ready=false;
setProgress(.55);
loadModels(()=>{applySettings();player.human=makeHuman(PLAYER_LOOK);player.h=player.human;scene.add(player.human.g);equipPlayer();populate();
  const f=focus();camera.position.set(f.x-6,3,f.z);camera.lookAt(f.x,1,f.z);try{renderer.compile(scene,camera);}catch(e){}
  ready=true;setProgress(1);});
requestAnimationFrame(frame);
},40));
</script>
